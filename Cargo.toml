[package]
name = "crabsid"
version = "0.1.0"
edition = "2024"
authors = ["Mikael Lund"]
license = "GPL-3.0-or-later"
description = "A command-line SID music player"
repository = "https://github.com/mlund/crabsid"
keywords = ["sid", "c64", "commodore", "chiptune", "music"]
categories = ["multimedia::audio", "emulators"]

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.17"
crossterm = "0.29"
dirs = "6"
md-5 = "0.10"
mos6502 = "0.8"
ratatui = "0.30"
residfp = { git = "https://github.com/mlund/residfp", features = ["ekv-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = "3"

[profile.release]
strip = true
lto = true

